plugins {
    id 'java'
    id 'application'
}

group = 'br.com.designliquido'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'br.com.designliquido.delegua.gui.HostSwing'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
